# ══════════════════════════════════════════════════════════════
#  Graphiti MCP Server — config.yaml
#  Docs: https://help.getzep.com/graphiti/getting-started/mcp-server
#  Jerarquía: CLI args > env vars > este archivo
# ══════════════════════════════════════════════════════════════

transport: http   # Claude Code soporta HTTP nativamente.
                  # Claude Desktop necesita mcp-remote como proxy.

# ── LLM: DeepSeek (doc 08 §7 + §9, prueba de extracción del 2026-08-01) ──
# ⚠ TRAMPA DOCUMENTADA (doc 08 §3): LLM y embedder comparten por defecto
#   ${OPENAI_API_URL}/${OPENAI_API_KEY}. Apuntar esa única variable a DeepSeek
#   ROMPE los embeddings (DeepSeek no ofrece embeddings). Por eso las variables
#   van SEPARADAS aquí: DEEPSEEK_* para el LLM, OPENAI_* fijo para el embedder.
llm:
  # 'deepseek-chat' y NO 'deepseek-v4-flash': el alias sigue vivo y responde en
  # NO-THINKING (verificado 08-01; 0 reasoning tokens en 47 llamadas reales).
  # A secas, v4-flash arranca CON thinking y multiplica el gasto 2-5×. Como el
  # config.yaml no admite extra_body, el alias es la única vía no-thinking aquí.
  # ⚠ El alias está deprecado (2026-07-24) y no aparece en /v1/models: si algún
  #   día devuelve 404, plan B = subclase de OpenAIGenericClient con
  #   extra_body={"thinking":{"type":"disabled"}} (doc 08 §2).
  model: ${MODEL_NAME:deepseek-chat}
  small_model: ${SMALL_MODEL_NAME:deepseek-chat}
  temperature: 0.1             # Bajo → extracción determinista y consistente
  # CRÍTICO: DeepSeek solo soporta json_object, NO json_schema. Con json_schema
  # la extracción falla con schemas incorrectos e ingestas rotas.
  structured_output_mode: ${LLM_STRUCTURED_OUTPUT_MODE:json_object}
  providers:
    openai:
      api_key: ${DEEPSEEK_API_KEY}
      api_url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1}
  # Ruta anterior (OpenAI), si se revierte:
  #   model: gpt-4.1-mini / small_model: gpt-4.1-nano
  #   structured_output_mode: json_schema
  #   providers.openai.api_key: ${OPENAI_API_KEY}
  #   providers.openai.api_url: https://api.openai.com/v1

# ── Embeddings ─────────────────────────────────────────────────────────
# ⚠ El embedder es INDEPENDIENTE del llm de arriba y NO puede ir a DeepSeek.
#   Su URL queda FIJA en api.openai.com aunque el LLM apunte a otro sitio.
embedder:
  model: ${EMBEDDER_MODEL:text-embedding-3-small}   # 1536 dims, ~$0.02-0.05/mes
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      api_url: https://api.openai.com/v1
  # Alternativa GRATIS con la misma key de Gemini (ruta 2 del .env.example):
  # provider: "gemini"
  # model: "text-embedding-004"
  # Alternativa 100% local (sin key, sin red; corre en el server MCP):
  # provider: "sentence_transformers"
  # model: "all-MiniLM-L6-v2"       # 384 dims, sin costo, OK para uso personal

# ── Reranker / cross-encoder: DECISIÓN = NO RERANKEAR ──────────────────
# El reranker NO puede ser DeepSeek: OpenAIRerankerClient usa `logit_bias` con
# IDs del tokenizer de OpenAI, que en el de DeepSeek apuntan a tokens
# arbitrarios (doc 08 §3). Y `CrossEncoderFactory` HEREDA el provider del LLM,
# así que sin intervención se iría a DeepSeek solo y fallaría en silencio.
#
# Elegido: **sin reranker**. Solo afecta a las BÚSQUEDAS, no a `add_episode`,
# y a escala personal el rerankeo no aporta lo que cuesta. Alternativa si la
# calidad de retrieval decepciona: `BGERerankerClient` LOCAL (gratis, pero mete
# torch en la imagen del MCP). Lo que NO se hace nunca: dejar que caiga a
# DeepSeek.
#
# ⚠ PENDIENTE DE VERIFICAR al desplegar el MCP server: no está confirmado que
#   su config.yaml exponga una clave para esto — puede requerir tocar
#   `factories.py`. Verificar que el cross-encoder resultante NO apunta a
#   api.deepseek.com antes de dar por buena la primera búsqueda.

# ── Base de datos ──────────────────────────────────────────────────────
database:
  provider: "falkordb"
  falkordb:
    host: "falkordb"    # nombre del servicio en docker-compose
    port: 6379
    # database: "graphiti"  # desde PR #1209: única DB con group_id para aislar

# ── Tipos de entidad para extracción ───────────────────────────────────
# Graphiti extrae AUTOMÁTICAMENTE estas entidades de cada episodio.
# Los built-in (Preference, Requirement, etc.) siempre están activos.
# Aquí añadimos tipos específicos para desarrollo de software.
entity_types:

  # ── Built-in (siempre activos) ───────────────────────────────────
  - name: Preference
    description: "Preferencias del desarrollador — frameworks, librerías, estilos de código"

  - name: Procedure
    description: "Procedimientos estándar — cómo hacer deploy, cómo correr tests, cómo hacer X"

  - name: Requirement
    description: "Requisitos del proyecto — funcionales y no funcionales"

  # ── Custom para desarrollo de software ───────────────────────────
  - name: ArchitectureDecision
    description: "Decisiones de arquitectura (ADRs) — por qué se eligió X sobre Y"

  - name: BugFix
    description: "Bugs encontrados y sus soluciones — síntoma, causa raíz, fix aplicado"

  - name: LibraryVersion
    description: "Versiones de dependencias importantes — breaking changes, migration notes"

  - name: CodePattern
    description: "Patrones de código recurrentes en el proyecto — buenos y anti-patrones"

  - name: ProjectConvention
    description: "Convenciones del proyecto — naming, estructura de carpetas, estilo"

  - name: DeploymentNote
    description: "Notas de deployment — configs de infra, variables de entorno, servicios"

# ── Deduplicación ─────────────────────────────────────────────────────
# Evita guardar el mismo hecho 10 veces en sesiones repetidas.
deduplication:
  enabled: true
  threshold: 0.85   # 0.0-1.0 (más alto = más estricto, menos duplicados)

# ── Cola de procesamiento ─────────────────────────────────────────────
# Procesamiento asíncrono para no bloquear Claude Code mientras Graphiti
# extrae entidades (proceso de 500ms-2s por episodio).
queue:
  enabled: true
  max_workers: 3    # debe coincidir con SEMAPHORE_LIMIT en .env
